version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: laps_api_prod
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - laps_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: laps_web_prod
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - laps_network

networks:
  laps_network:
    driver: bridge
